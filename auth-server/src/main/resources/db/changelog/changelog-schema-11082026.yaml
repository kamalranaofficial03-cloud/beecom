
databaseChangeLog:
  # =========================
  # USERS TABLE
  # =========================
  - changeSet:
      id: create-users-table
      author: developer
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(256)
                  constraints:
                    nullable: false

              - column:
                  name: account_locked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_date
                  type: TIMESTAMP

              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

              - column:
                  name: last_modified_date
                  type: TIMESTAMP

        - sql:
            sql: >
              ALTER TABLE users
              ADD CONSTRAINT chk_username_length
              CHECK (CHAR_LENGTH(username) >= 15)

  # =========================
  # ROLES TABLE
  # =========================
  - changeSet:
      id: create-roles-table
      author: developer
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_date
                  type: TIMESTAMP

              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

              - column:
                  name: last_modified_date
                  type: TIMESTAMP

  # =========================
  # PERMISSIONS TABLE
  # =========================
  - changeSet:
      id: create-permissions-table
      author: developer
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: permission
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_date
                  type: TIMESTAMP

              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

              - column:
                  name: last_modified_date
                  type: TIMESTAMP

  # =========================
  # USERS_ROLES TABLE
  # =========================
  - changeSet:
      id: create-users-roles-table
      author: developer
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: users_roles
            columnNames: user_id, role_id
            constraintName: pk_users_roles

        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_roles_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: users_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_roles_role
            onDelete: CASCADE

  # =========================
  # ROLES_PERMISSIONS TABLE
  # =========================
  - changeSet:
      id: create-roles-permissions-table
      author: developer
      changes:
        - createTable:
            tableName: roles_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: roles_permissions
            columnNames: role_id, permission_id
            constraintName: pk_roles_permissions

        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_roles_permissions_role
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: roles_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_roles_permissions_permission
            onDelete: CASCADE
