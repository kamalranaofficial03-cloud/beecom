
databaseChangeLog:
  - changeSet:
      id: 001-create-accounts-table
      author: developer
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
                    nullable: false

              - column:
                  name: contact_no
                  type: VARCHAR(20)

              - column:
                  name: first_name
                  type: VARCHAR(100)

              - column:
                  name: last_name
                  type: VARCHAR(100)

              - column:
                  name: username
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_accounts_username

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

              - column:
                  name: last_modified_date
                  type: DATETIME

  - changeSet:
      id: 002-create-addresses-table
      author: developer
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_addresses
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)

              - column:
                  name: address
                  type: VARCHAR(500)

              - column:
                  name: city
                  type: VARCHAR(100)

              - column:
                  name: state
                  type: VARCHAR(100)

              - column:
                  name: landmark
                  type: VARCHAR(255)

              - column:
                  name: pincode
                  type: VARCHAR(20)

              - column:
                  name: country
                  type: VARCHAR(100)

              - column:
                  name: contact_no
                  type: VARCHAR(20)

              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: created_date
                  type: DATETIME

              - column:
                  name: last_modified_by
                  type: VARCHAR(255)

              - column:
                  name: last_modified_date
                  type: DATETIME

        - addForeignKeyConstraint:
            baseTableName: addresses
            baseColumnNames: account_id
            constraintName: fk_addresses_account
            referencedTableName: accounts
            referencedColumnNames: id

        - createIndex:
            tableName: addresses
            indexName: idx_addresses_account_id
            columns:
              - column:
                  name: account_id
