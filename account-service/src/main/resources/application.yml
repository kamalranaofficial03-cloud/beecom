server:
  port: 8090
  security:
    oauth2:
      resourceserver:
        jwt:
          # Defaults target a local (non-Docker) run on the host. Inside Docker
          # these are overridden by env vars in docker-compose.yml to use the
          # auth-server service hostname on the demo-network.
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.security: trace

spring:
  liquibase:
    change-log: classpath:/db/changelog/changelog-account-master.yaml
  datasource:
    username: root
    password: kamalrana03@
    url: jdbc:mysql://localhost:3306/kamaldb
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9000"
          audiences:
            - "oidc-client"
            - "gateway-client"
            - "cashcard-client"
